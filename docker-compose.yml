services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_builder
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  mailpit: # local SMTP sink + web UI for auth emails
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  # Backend services are separate processes, so they scale independently:
  #   docker compose --profile full up --scale worker=3
  api: &backend
    build: { context: ., dockerfile: backend/Dockerfile }
    command: node src/services/api/index.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_builder
      SMTP_HOST: mailpit
      UV_THREADPOOL_SIZE: 16 # argon2 hashing runs on the libuv thread pool
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
    profiles: ["full"]

  worker:
    <<: *backend
    command: node src/services/worker/index.js
    ports: []

volumes:
  pgdata:
